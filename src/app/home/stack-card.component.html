<div class="p-4 rounded-lg border border-gray-200">
  <h3 class="text-lg font-bold">{{ stack.name }}</h3>
  <p class="text-sm text-gray-500">{{ episodesForStack?.length }} episódios</p>

  <app-progress-bar
    [reviewed]="episodesForStack() | pendingCount"
    [total]="episodesForStack().length"
  ></app-progress-bar>
  <app-pending-badge [level]="episodesForStack() | urgencyLevel"> </app-pending-badge>
</div>
