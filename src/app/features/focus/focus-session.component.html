<div>
  <p>
    {{ (session()?.currentIndex ?? 0) + 1 }} de {{ session()?.episodes?.length ?? 0 }} episódios
  </p>

  @if (currentEpisode(); as episode) {
    <app-episode-detail [eid]="episode.id" [focusMode]="true" />
  }

  <button (click)="markReviewedAndNext()">Marcar revisado e próximo</button>
  <button (click)="skipToNext()">Pular</button>
  <button (click)="endFocusSession()">Encerrar sessão</button>
</div>
