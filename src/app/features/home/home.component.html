@if (stacks().length === 0) {
  <app-empty-state
    [message]="'Nenhuma stack encontrada'"
    [ctaLabel]="'Criar stack'"
    [ctaClick]="onCreateStack"
  ></app-empty-state>
}

@if (stacks().length > 0) {
  <div class="flex justify-center gap-4 py-12 text-center">
    <button
      mat-flat-button
      class="bg-indigo-600 text-white px-4 py-2 rounded"
      (click)="onCreateStack()"
    >
      Criar stack
    </button>
  </div>
}

@for (stack of stacks(); track stack.id) {
  <app-stack-card [stack]="stack"></app-stack-card>
}

@if (welcomeMessage()) {
  <p class="text-center text-gray-500">{{ welcomeMessage() }}</p>
}
