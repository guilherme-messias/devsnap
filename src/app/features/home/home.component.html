<section class="flex flex-col gap-6 px-4 py-6 md:px-6 md:py-8">
  <header class="flex flex-col gap-1">
    <span
      class="text-xs font-semibold uppercase tracking-widest"
      style="color: var(--color-primary)"
    >
      DevSnap
    </span>
    <h1
      class="text-2xl font-bold leading-tight md:text-3xl"
      style="color: var(--color-text-primary)"
    >
      Minhas stacks
    </h1>
    @if (welcomeMessage()) {
      <p class="text-sm leading-relaxed" style="color: var(--color-text-secondary)">
        {{ welcomeMessage() }}
      </p>
    }
  </header>

  @if (stacks().length === 0) {
    <app-empty-state
      [message]="'Nenhuma stack encontrada'"
      [ctaLabel]="'Criar stack'"
      [ctaClick]="onCreateStack"
    />
  } @else {
    <div class="flex justify-center">
      <button mat-flat-button color="primary" type="button" (click)="onCreateStack()">
        Criar stack
      </button>
    </div>

    <div class="grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
      @for (stack of stacks(); track stack.id) {
        <app-stack-card [stack]="stack" />
      }
    </div>
  }
</section>
