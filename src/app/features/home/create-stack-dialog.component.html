<h2 mat-dialog-title>Criar Stack</h2>

<mat-dialog-content>
  <form (ngSubmit)="save()">
    <mat-form-field class="w-full">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="name" placeholder="Digite o nome da stack" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-flat-button color="primary" type="submit">Criar</button>
</mat-dialog-actions>
