<form [formGroup]="form">
  <mat-form-field appearance="outline">
    <mat-label>Stack</mat-label>
    <mat-select formControlName="stackId">
      @for (stack of stacks(); track stack.id) {
        <mat-option value="{{ stack.id }}">{{ stack.name }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <div formGroupName="episodeData">
    <mat-form-field appearance="outline">
      <mat-label>"Título do episódio</mat-label>
      <input matInput formControlName="title" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Erro encontrado</mat-label>
      <input matInput formControlName="error" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>O que você tentou</mat-label>
      <input matInput formControlName="attempts" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>O que resolveu</mat-label>
      <input matInput formControlName="solution" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Por que funcionou</mat-label>
      <input matInput formControlName="reasoning" />
    </mat-form-field>
  </div>

  <mat-form-field appearance="outline">
    <mat-label>Snippet</mat-label>
    <input matInput formControlName="snippet" />
  </mat-form-field>

  <mat-form-field>
    <mat-chip-grid #chipGrid>
      @for (tag of tags(); track tag) {
        <mat-chip-row (removed)="removeTag(tag)"
          >{{ tag }}

          <button matChipRemove>
            <mat-icon>X</mat-icon>
          </button>
        </mat-chip-row>
      }
    </mat-chip-grid>

    <input
      placeholder="Adicionar tag"
      [matChipInputFor]="chipGrid"
      [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
      (matChipInputTokenEnd)="addTag($event)"
      [value]="currentTag()"
    />
  </mat-form-field>
</form>
